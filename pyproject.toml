[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ashiba-steward"
version = "0.1.0"
description = "Project Memory Anchor, the local-first sensor CLI for Ashiba Steward."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE.md", "NOTICE.md", "LICENSES/*.txt"]
dependencies = []

[project.optional-dependencies]
token-measurement = ["tiktoken"]

[project.scripts]
pma = "pma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
